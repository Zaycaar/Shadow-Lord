ment<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weird Wizard: Character Options Master List</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        :root { --dark: #121212; --card: #1e1e1e; --accent: #752394; --text: #e0e0e0; --grey: #888; --positive: #2a9d8f; --negative: #e76f51; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--dark); color: var(--text); margin: 0; padding: 20px; line-height: 1.5; }
        .container { max-width: 1100px; margin: auto; }
        header { border-bottom: 2px solid var(--accent); margin-bottom: 20px; padding-bottom: 10px; }
        
        /* Updated Controls Layout */
        .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; background: var(--card); padding: 15px; border-radius: 8px; align-items: center; }
        input, select { background: #333; color: white; border: 1px solid #444; padding: 10px; border-radius: 4px; }
        .search-input { flex-grow: 2; }
        .mode-select { font-weight: bold; border: 2px solid #444; }
        .mode-in { color: var(--positive); border-color: var(--positive); }
        .mode-out { color: var(--negative); border-color: var(--negative); }

        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 8px; overflow: hidden; }
        th { background: #2a2a2a; text-align: left; padding: 12px; border-bottom: 2px solid var(--accent); font-size: 0.9rem; }
        td { padding: 12px; border-bottom: 1px solid #333; vertical-align: top; }
        tr:hover { background: #252525; }
        .cat-badge { font-size: 0.7rem; font-weight: bold; padding: 3px 6px; border-radius: 4px; background: var(--accent); color: white; text-transform: uppercase; }
        .tag-pill { display: inline-block; background: #444; font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; margin: 2px; color: #ccc; }
        .source-text { font-size: 0.85rem; color: var(--grey); white-space: nowrap; }
    </style>
</head>
<body>

<div id="app" class="container">
    <header>
        <h1>Shadow of the Weird Wizard <small style="color:var(--grey); font-weight:normal;">| Compendium</small></h1>
        <a href="index.html" style="color: #888; text-decoration: none;">← Back to Main Menu</a>
    </header>

    <div class="controls">
        <select v-model="filterMode" :class="filterMode === 'IN' ? 'mode-in' : 'mode-out'" class="mode-select">
            <option value="IN">SHOW TAGS:</option>
            <option value="OUT">HIDE TAGS:</option>
        </select>

        <input type="text" v-model="search" placeholder="Type tags here (e.g. Magic, Fire)..." class="search-input">
        
        <select v-model="filterCat">
            <option value="All">All Categories</option>
            <option v-for="c in categories" :value="c">{{c}}</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>Category</th>
                <th>Name</th>
                <th>Summary/Tags</th>
                <th>Source</th>
            </tr>
        </thead>
        <tbody>
            <tr v-for="item in filtered" :key="item.name">
                <td data-label="Category"><span class="cat-badge">{{item.cat}}</span></td>
                <td data-label="Name"><strong>{{item.name}}</strong></td>
                <td>
                    <div style="font-size: 0.9rem;" v-html="item.desc"></div>
                    <div style="margin-top:5px">
                        <span class="tag-pill" v-for="t in item.tags">{{t}}</span>
                    </div>
                </td>
                <td class="source-text">{{item.src}} <br> pg. {{item.pg}}</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
const { createApp } = Vue
createApp({
    data() {
        return {
            search: '',
            filterCat: 'All',
            filterMode: 'IN', // Default to showing results
            categories: ['Ancestry', 'Novice Path', 'Expert Path', 'Master Path', 'Tradition'],
            database: [
                // Check for weapon compatibility with traditions
    { cat: 'Ancestry', name: 'Human', desc: 'Varied in appearance. Can be look <b>however you want</b>. If you are not sopmething else, you are human.', tags: ['Mortal', 'Common'], src: 'WW Core', pg: '10' },
    { cat: 'Novice Path', name: 'Fighter', desc: 'Trained in weapons and armor. Customize with fighting styles.', tags: ['Combat'], src: 'WW Core', pg: '21' },
    { cat: 'Novice Path', name: 'Mage', desc: 'Proficient spellcaster.', tags: ['Magic'], src: 'WW Core', pg: '22' },
    { cat: 'Novice Path', name: 'Priest', desc: '', tags: ['Religious', 'Magic', 'Support', 'Combat'], src: 'WW Core', pg: '23' },
    { cat: 'Novice Path', name: 'Rogue', desc: 'Fast and tricksy. Customize with Rogue Techniques.', tags: ['Agility', 'Combat'], src: 'WW Core', pg: '24' },
    { cat: 'Tradition', name: 'Aeromancy', desc: 'Wind, Lightning, and Flight.', tags: ['Will'], src: 'WW Core', pg: '76' },
    { cat: 'Tradition', name: 'Alchemy', desc: 'Make potions and chemical weapons. Animate objects.', tags: ['Intellect'], src: 'WW Core', pg: '79' },
    { cat: 'Tradition', name: 'Alteration', desc: 'Alter the body. Heal, harm, and enhance.', tags: ['Intellect'], src: 'WW Core', pg: '81' },
    { cat: 'Tradition', name: 'Animism', desc: 'Call upon and befriend the spirits of the land.', tags: ['Will'], src: 'WW Core', pg: '83' },
    { cat: 'Tradition', name: 'Astromancy', desc: 'Moon ans Sun magic.', tags: ['Will'], src: 'WW Core', pg: '86' },
    { cat: 'Tradition', name: 'Chaos', desc: 'Warp reality. Random and unpredictable. Wild Magic.', tags: ['Intellect'], src: 'WW Core', pg: '89' },
    { cat: 'Tradition', name: 'Chronomancy', desc: 'Time manipulation.', tags: ['Intellect'], src: 'WW Core', pg: '94' },
    { cat: 'Tradition', name: 'Conjuration', desc: 'Summon creature, traps, objects, and structures.', tags: ['Intellect'], src: 'WW Core', pg: '96' },
    { cat: 'Tradition', name: 'Cryomancy', desc: 'Ice and snow.', tags: ['Will'], src: 'WW Core', pg: '99' },
    { cat: 'Tradition', name: 'Dark Arts', desc: 'Cure and afflict mind and body. Evil.', tags: ['Intellect'], src: 'WW Core', pg: '102' },
    { cat: 'Tradition', name: 'Destruction', desc: 'Entropy. Break bodies and objects.', tags: ['Will'], src: 'WW Core', pg: '105' },
    { cat: 'Tradition', name: 'Divination', desc: 'Precognition, clairvoyance, Omniscience.', tags: ['Intellect'], src: 'WW Core', pg: '107' },
    { cat: 'Tradition', name: 'Eldritch', desc: 'Madness of otherworldly entities.', tags: ['Intellect'], src: 'WW Core', pg: '109' },
    { cat: 'Tradition', name: 'Enchantment', desc: 'Mental manipulation. Force emotions and comliance.', tags: ['Intellect'], src: 'WW Core', pg: '113' },
    { cat: 'Tradition', name: 'Evocation', desc: 'A voice that alters reality.', tags: ['Universal'], src: 'WW Core', pg: '116' },
    { cat: 'Tradition', name: 'Geomancy', desc: 'Earth and metal control.', tags: ['Will'], src: 'WW Core', pg: '118' },
    { cat: 'Tradition', name: 'Hydromancy', desc: 'Water, clouds, acid, sea creatures.', tags: ['Will'], src: 'WW Core', pg: '121' },
    { cat: 'Tradition', name: 'Illusion', desc: 'False sounds and sights.', tags: ['Intellect'], src: 'WW Core', pg: '124' },
    { cat: 'Tradition', name: 'Invocation', desc: 'Manifest the divine. Heal, harm, help.', tags: ['Universal'], src: 'WW Core', pg: '127' },
    { cat: 'Tradition', name: 'Necromancy', desc: 'Raise dead. Shape bone. Underworld magic.', tags: ['Intellect'], src: 'WW Core', pg: '129' },
    { cat: 'Tradition', name: 'Oneiromancy', desc: 'Shape and force dreams.', tags: ['Intellect'], src: 'WW Core', pg: '132' },
    { cat: 'Tradition', name: 'Order', desc: 'Force magic. Predictable an stable.', tags: ['Intellect'], src: 'WW Core', pg: '135' },
    { cat: 'Tradition', name: 'Primal', desc: 'Channel bestial traits.', tags: ['Will'], src: 'WW Core', pg: '137' },
    { cat: 'Tradition', name: 'Protection', desc: 'Protection and security. Traps. Anti-magic.', tags: ['Universal'], src: 'WW Core', pg: '140' },
    { cat: 'Tradition', name: 'Psychomancy', desc: 'Telepathy and Telekinesis.', tags: ['Intellect', 'Will'], src: 'WW Core', pg: '142' },
    { cat: 'Tradition', name: 'Pyromancy', desc: 'Fire and destruction.', tags: ['Will'], src: 'WW Core', pg: '144' },
    { cat: 'Tradition', name: 'Shadowmancy', desc: 'Dangers in the dark. Shadow blades.', tags: ['Intellect'], src: 'WW Core', pg: '147' },
    { cat: 'Tradition', name: 'Skullduggery', desc: 'Stealth magic. Get in, get out.', tags: ['Universal'], src: 'WW Core', pg: '150' },
    { cat: 'Tradition', name: 'Spiritualism', desc: 'Utilize the spirit world.', tags: ['Will'], src: 'WW Core', pg: '152' },
    { cat: 'Tradition', name: 'Symbolism', desc: 'Inscribe runes and sigils.', tags: ['Universal'], src: 'WW Core', pg: '154' },
    { cat: 'Tradition', name: 'Technomancy', desc: 'Use tools to craft gadgets and weapons.', tags: ['Intellect'], src: 'WW Core', pg: '158' },
    { cat: 'Tradition', name: 'Teleportation', desc: '', tags: ['Intellect'], src: 'WW Core', pg: '159' },
    { cat: 'Tradition', name: 'War', desc: 'Combat magic.', tags: ['Universal'], src: 'WW Core', pg: '161' },
            ]
        }
    },
    computed: {
        filtered() {
            return this.database.filter(i => {
                const s = this.search.toLowerCase().trim();
                const matchCat = this.filterCat === 'All' || i.cat === this.filterCat;
                
                // If search is empty, just filter by Category
                if (!s) return matchCat;

                // Check if any tag or name matches the search
                const hasMatch = i.name.toLowerCase().includes(s) || 
                                i.tags.some(t => t.toLowerCase().includes(s)) ||
                                i.src.toLowerCase().includes(s);

                // LOGIC: If Mode is IN, return items that have the match.
                // If Mode is OUT, return items that DO NOT have the match.
                const matchSearch = this.filterMode === 'IN' ? hasMatch : !hasMatch;

                return matchSearch && matchCat;
            }).sort((a, b) => a.name.localeCompare(b.name));
        }
    }
}).mount('#app')
</script>

</body>
</html>
