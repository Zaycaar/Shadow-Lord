<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SotDL: Item Master List</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        :root { --dark: #121212; --card: #1e1e1e; --accent: #9b2226; --text: #e0e0e0; --grey: #888; --positive: #2a9d8f; --gold: #daa520; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--dark); color: var(--text); margin: 0; padding: 20px; line-height: 1.5; }
        .container { max-width: 1100px; margin: auto; }
        header { border-bottom: 2px solid var(--accent); margin-bottom: 20px; padding-bottom: 10px; }
        
        .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; background: var(--card); padding: 15px; border-radius: 8px; align-items: center; }
        input, select { background: #333; color: white; border: 1px solid #444; padding: 10px; border-radius: 4px; }
        .search-input { flex-grow: 2; }

        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 8px; overflow: hidden; }
        th { background: #2a2a2a; text-align: left; padding: 12px; border-bottom: 2px solid var(--accent); font-size: 0.9rem; color: var(--grey); text-transform: uppercase; }
        td { padding: 10px 12px; border-bottom: 1px solid #333; vertical-align: middle; white-space: nowrap; }
        
        /* Ensure the description can still be read but stays on one line if you prefer */
        .desc-cell { white-space: normal; font-size: 0.9rem; min-width: 300px; }
        
        tr:hover { background: #252525; }
        .cat-badge { font-size: 0.7rem; font-weight: bold; padding: 3px 6px; border-radius: 4px; background: var(--accent); color: white; text-transform: uppercase; }
        .cost-text { color: var(--gold); font-family: monospace; font-weight: bold; }
        .source-text { font-size: 0.8rem; color: var(--grey); }
    </style>
</head>
<body>

<div id="app" class="container">
    <header>
        <h1>Shadow of the Demon Lord <small style="color:var(--grey); font-weight:normal;">| Item Catalogue</small></h1>
    </header>

    <div class="controls">
        <input type="text" v-model="search" placeholder="Search by name or description..." class="search-input">
        
        <select v-model="filterCat">
            <option value="All">All Categories</option>
            <option v-for="c in categories" :value="c">{{c}}</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 100px;">Category</th>
                <th style="width: 200px;">Name</th>
                <th>Description</th>
                <th style="width: 100px;">Cost</th>
                <th style="width: 120px;">Source</th>
            </tr>
        </thead>
        <tbody>
            <tr v-for="item in filtered" :key="item.name">
                <td><span class="cat-badge">{{item.cat}}</span></td>
                <td><strong>{{item.name}}</strong></td>
                <td class="desc-cell">{{item.desc}}</td>
                <td class="cost-text">{{item.cost}}</td>
                <td class="source-text">{{item.src}} (pg. {{item.pg}})</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
const { createApp } = Vue
createApp({
    data() {
        return {
            search: '',
            filterCat: 'All',
            // Define your categories here for the dropdown
            categories: ['Weapon', 'Armor', 'Gear', 'Potion', 'Relic'],
            database: [
                { cat: 'Weapon', name: 'Longsword', desc: '1d6+2 damage. 1 handed.', cost: '2 ss', src: 'Core', pg: 102 },
                { cat: 'Armor', name: 'Mail', desc: 'Defense 15. Str 11 req. Agi max 20.', cost: '5 ss', src: 'Core', pg: 105 },
                { cat: 'Potion', name: 'Healing Potion', desc: 'Heals damage equal to healing rate.', cost: '1 gc', src: 'Core', pg: 108 },
                { cat: 'Gear', name: 'Lantern', desc: '5-yard radius light for 4 hours.', cost: '5 cp', src: 'Core', pg: 106 }
                // Add your items here, one per line
            ]
        }
    },
    computed: {
        filtered() {
            return this.database.filter(i => {
                const s = this.search.toLowerCase().trim();
                const matchCat = this.filterCat === 'All' || i.cat === this.filterCat;
                
                if (!s) return matchCat;

                // Search name, description, and source
                const hasMatch = i.name.toLowerCase().includes(s) || 
                                i.desc.toLowerCase().includes(s) ||
                                i.src.toLowerCase().includes(s);

                return hasMatch && matchCat;
            }).sort((a, b) => a.name.localeCompare(b.name));
        }
    }
}).mount('#app')
</script>

</body>
</html>
