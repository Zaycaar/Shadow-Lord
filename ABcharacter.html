<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Abaddon: Character Options Master List</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        :root { --dark: #121212; --card: #1e1e1e; --accent: #8F8725; --text: #e0e0e0; --grey: #888; --positive: #2a9d8f; --negative: #e76f51; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--dark); color: var(--text); margin: 0; padding: 20px; line-height: 1.5; }
        .container { max-width: 1100px; margin: auto; }
        header { border-bottom: 2px solid var(--accent); margin-bottom: 20px; padding-bottom: 10px; }
        
        /* Updated Controls Layout */
        .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; background: var(--card); padding: 15px; border-radius: 8px; align-items: center; }
        input, select { background: #333; color: white; border: 1px solid #444; padding: 10px; border-radius: 4px; }
        .search-input { flex-grow: 2; }
        .mode-select { font-weight: bold; border: 2px solid #444; }
        .mode-in { color: var(--positive); border-color: var(--positive); }
        .mode-out { color: var(--negative); border-color: var(--negative); }

        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 8px; overflow: hidden; }
        th { background: #2a2a2a; text-align: left; padding: 12px; border-bottom: 2px solid var(--accent); font-size: 0.9rem; }
        td { padding: 12px; border-bottom: 1px solid #333; vertical-align: top; }
        tr:hover { background: #252525; }
        .cat-badge { font-size: 0.7rem; font-weight: bold; padding: 3px 6px; border-radius: 4px; background: var(--accent); color: white; text-transform: uppercase; }
        .tag-pill { display: inline-block; background: #444; font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; margin: 2px; color: #ccc; }
        .source-text { font-size: 0.85rem; color: var(--grey); white-space: nowrap; }
    </style>
</head>
<body>

<div id="app" class="container">
    <header>
        <h1>Abaddon: Angel in the Void <small style="color:var(--grey); font-weight:normal;">| Compendium</small></h1>
        <a href="ABindex.html" style="color: #888; text-decoration: none;">← Back to Main Menu</a>
    </header>

    <div class="controls">
        <select v-model="filterMode" :class="filterMode === 'IN' ? 'mode-in' : 'mode-out'" class="mode-select">
            <option value="IN">SHOW TAGS:</option>
            <option value="OUT">HIDE TAGS:</option>
        </select>

        <input type="text" v-model="search" placeholder="Type tags here (e.g. Magic, Fire)..." class="search-input">
        
        <select v-model="filterCat">
            <option value="All">All Categories</option>
            <option v-for="c in categories" :value="c">{{c}}</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>Category</th>
                <th>Name</th>
                <th>Summary/Tags</th>
                <th>Source</th>
            </tr>
        </thead>
        <tbody>
            <tr v-for="item in filtered" :key="item.name">
                <td data-label="Category"><span class="cat-badge">{{item.cat}}</span></td>
                <td data-label="Name"><strong>{{item.name}}</strong></td>
                <td>
                    <div style="font-size: 0.9rem;" v-html="item.desc"></div>
                    <div style="margin-top:5px">
                        <span class="tag-pill" v-for="t in item.tags">{{t}}</span>
                    </div>
                </td>
                <td class="source-text">{{item.src}} <br> pg. {{item.pg}}</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
const { createApp } = Vue
createApp({
    data() {
        return {
            search: '',
            filterCat: 'All',
            filterMode: 'IN', // Default to showing results
            categories: ['Ancestry', 'Novice Path', 'Power', 'Faction'],
            database: [
    { cat: 'Ancestry', name: 'Human', desc: 'A catch-all term for the thinking and self-aware residents of Sanctuary Spire. No set or assumed appearance.', tags: ['Mortal', 'Common'], src: 'Abaddon Core', pg: '9' },
    { cat: 'Novice Path', name: 'Academic', desc: 'Sharp mind. Problem solver. Reader and engineer.', tags: ['Support', 'Intellect'], src: 'Abaddon Novice Guide', pg: '13' },
    { cat: 'Novice Path', name: 'Fanatic', desc: 'Commited to a cause. Single minded focus and aggression.', tags: ['Will', 'Combat'], src: 'Abaddon Novice Guide', pg: '14' },
    { cat: 'Novice Path', name: 'Fighter', desc: 'Trained in weapons and armor.', tags: ['Combat', 'Weapon'], src: 'Abaddon Novice Guide', pg: '15' },
    { cat: 'Novice Path', name: 'Survivor', desc: 'Tricksy and nimble combatant.', tags: ['Combat', 'Weapon'], src: 'Abaddon Novice Guide', pg: '16' },
    { cat: 'Power', name: 'Psychic', desc: 'Mental powers caused by mutation.', tags: [], src: 'Abaddon Novice Guide', pg: '18' },
    { cat: 'Power', name: 'Magic', desc: 'Manipulate Aethyr, the natural energy fields of Abaddon.', tags: [], src: 'Abaddon Novice Guide', pg: '24' },
    { cat: 'Faction', name: 'Arkanix', desc: 'Engineers and salvagers.', tags: ['Tech'], src: 'Abaddon Novice Guide', pg: '7' },
    { cat: 'Faction', name: 'The august Chroniclery', desc: 'Historians and archaeologists.', tags: ['Knowledge'], src: 'Abaddon Novice Guide', pg: '7' },
    { cat: 'Faction', name: 'Dogmatics', desc: 'Priests of The Authority.', tags: ['Magic'], src: 'Abaddon Novice Guide', pg: '7' },
    { cat: 'Faction', name: 'Esoteric Order of Occult Ephemera', desc: 'Keepers of magic and arcane secrets.', tags: ['Magic'], src: 'Abaddon Novice Guide', pg: '8' },
    { cat: 'Faction', name: 'Hegemony of the Golden Fist', desc: 'Combat trained separatists. Seek freedom from The Authority.', tags: ['Combat'], src: 'Abaddon Novice Guide', pg: '8' },
    { cat: 'Faction', name: 'Physika', desc: 'Farmers and doctors. Make life better.', tags: ['Support'], src: 'Abaddon Novice Guide', pg: '9' },
    { cat: 'Faction', name: 'Purist Crusade', desc: 'Enemies of evil, and the Voidsworn', tags: ['Combat'], src: 'Abaddon Novice Guide', pg: '9' },
    { cat: 'Faction', name: 'Scions of OM', desc: 'Plug into an AI hivemind.', tags: ['OM'], src: 'Abaddon Novice Guide', pg: '10' },
    { cat: 'Faction', name: 'Third Eye Society', desc: 'Group of Psykens', tags: ['Psychic'], src: 'Abaddon Novice Guide', pg: '10' },
    { cat: 'Faction', name: 'Transcendance Initiative', desc: 'Building an ark to leave Abaddon.', tags: [], src: 'Abaddon Novice Guide', pg: '11' },
    { cat: 'Faction', name: 'Ronin', desc: 'Unaffiliated, self-reliant.', tags: [], src: 'Abaddon Novice Guide', pg: '11' },
            ]
        }
    },
    computed: {
        filtered() {
            return this.database.filter(i => {
                const s = this.search.toLowerCase().trim();
                const matchCat = this.filterCat === 'All' || i.cat === this.filterCat;
                
                // If search is empty, just filter by Category
                if (!s) return matchCat;

                // Check if any tag or name matches the search
                const hasMatch = i.name.toLowerCase().includes(s) || 
                                i.tags.some(t => t.toLowerCase().includes(s)) ||
                                i.src.toLowerCase().includes(s);

                // LOGIC: If Mode is IN, return items that have the match.
                // If Mode is OUT, return items that DO NOT have the match.
                const matchSearch = this.filterMode === 'IN' ? hasMatch : !hasMatch;

                return matchSearch && matchCat;
            }).sort((a, b) => a.name.localeCompare(b.name));
        }
    }
}).mount('#app')
</script>

</body>
</html>
