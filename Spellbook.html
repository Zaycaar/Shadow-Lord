<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow of the Demon Lord - Spell Database</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: #e0e0e0; margin: 20px; }
        .controls { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; position: sticky; top: 10px; z-index: 100; border: 1px solid #333; }
        input, select { padding: 10px; border-radius: 4px; border: 1px solid #444; background: #2d2d2d; color: white; min-width: 150px; }
        
        .spell-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .spell-card { background: #1e1e1e; border-radius: 6px; padding: 18px; border-top: 4px solid #555; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        
        /* Specific coloring for types */
        .card-attack { border-top-color: #b30000; }
        .card-utility { border-top-color: #0066cc; }

        .spell-name { font-size: 1.25em; font-weight: bold; color: #fff; }
        .type-tag { font-size: 0.75em; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; background: #333; }
        
        .spell-meta { font-size: 0.9em; color: #ffa500; margin-bottom: 12px; font-weight: 600; }
        .spell-desc { font-size: 0.95em; line-height: 1.5; color: #ccc; }
    </style>
</head>
<body>

    <h1 style="color: #b30000;">Grimoire: Shadow of the Demon Lord</h1>
    <a href="index.html" style="color: #888; text-decoration: none;">← Back to Main Menu</a>

        <input type="text" id="searchInput" placeholder="Search names..." onkeyup="filterSpells()">

    </div>

    <div class="spell-grid" id="spellGrid"></div>

function displaySpells(data) {
    const grid = document.getElementById('spellGrid');
    grid.innerHTML = '';
    
    data.forEach(spell => {
        const typeClass = spell.type === "Attack" ? "card-attack" : "card-utility";
        const card = document.createElement('div');
        card.className = `spell-card ${typeClass}`;
        
        card.innerHTML = `
            <div class="spell-header">
                <div class="spell-name">${spell.name}</div>
                <div class="type-tag">${spell.type}</div>
            </div>
            <div class="spell-meta">${spell.tradition.toUpperCase()} / RANK ${spell.rank}</div>
            <div class="spell-detail"><strong>Target/Area:</strong> ${spell.targetArea}</div>
            <div class="spell-detail"><strong>Duration:</strong> ${spell.duration}</div>
            <hr>
            <div class="spell-desc">${spell.desc}</div>
        `;
        grid.appendChild(card);
    });
}

    const search = document.getElementById('searchInput').value.toLowerCase();
    const trad = document.getElementById('traditionFilter').value;
    const rank = document.getElementById('rankFilter').value;
    const type = document.getElementById('typeFilter').value;

    const filtered = spells.filter(s => {
        const matchesSearch = s.name.toLowerCase().includes(search);
        const matchesTrad = (trad === "All" || s.tradition === trad);
        const matchesRank = (rank === "All" || s.rank.toString() === rank);
        const matchesType = (type === "All" || s.type === type);
        return matchesSearch && matchesTrad && matchesRank && matchesType;
    });

    displaySpells(filtered);
}

// --- SORTING LOGIC ---

function organizeSpells(spellList) {
    return spellList.sort((a, b) => {
        if (a.rank !== b.rank) {
            return a.rank - b.rank;
        }
        return a.name.localeCompare(b.name);
    });
}

function organizeSpells(spellList) {

        if (a.rank !== b.rank) {

        // If ranks are the same, compare the names alphabetically
        return a.name.localeCompare(b.name);
    });
