<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demon Lord</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .menu { text-align: center; background: #1e1e1e; padding: 40px; border-radius: 12px; border-top: 5px solid #D9D9D9; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 300px; }
        h1 { margin-bottom: 30px; color: #fff; }
        .btn { display: block; width: 250px; padding: 15px; margin: 10px auto; background: #333; color: white; text-decoration: none; border-radius: 6px; transition: 0.3s; font-weight: bold; border: 1px solid #444; cursor: pointer; font-size: 16px; }
        .btn:hover { background: #D9D9D9; border-color: #D9D9D9; transform: translateY(-2px); }
        
        /* Modal Styles */
        #wishlist { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1e1e1e; padding: 20px; border-radius: 12px; border: 2px solid #D9D9D9; max-height: 70vh; overflow-y: auto; width: 320px; z-index: 10; }
        #wishlist h2 { color: #D9D9D9; margin-top: 0; }
        #wishlist ul { list-style: none; padding: 0; text-align: left; }
        #wishlist li { padding: 8px 0; border-bottom: 1px solid #333; font-size: 0.9em; }
        .close-btn { background: #D9D9D9; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; margin-top: 15px; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 5; }
    </style>
</head>
<body>

    <div class="menu">
        <h1>Shadow Compendium</h1>
        <a href="DLIndex.html" class="btn">Shadow of the Demon Lord</a>
        <a href="WWindex.html" class="btn">Shadow of the Weird Wizard</a>
    </div>

    <script>
        function toggleWishlist() {
            const list = document.getElementById('wishlist');
            const overlay = document.getElementById('overlay');
            const isVisible = list.style.display === 'block';
            
            list.style.display = isVisible ? 'none' : 'block';
            overlay.style.display = isVisible ? 'none' : 'block';
        }
    </script>
</body>
</html>
