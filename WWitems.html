<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SotDL: Item and Equipment Index</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        :root { --dark: #121212; --card: #1e1e1e; --accent: #752394; --text: #e0e0e0; --grey: #888; --gold: #daa520; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--dark); color: var(--text); margin: 0; padding: 20px; line-height: 1.5; }
        .container { max-width: 1200px; margin: auto; }
        header { border-bottom: 2px solid var(--accent); margin-bottom: 20px; padding-bottom: 10px; }
        
        .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; background: var(--card); padding: 15px; border-radius: 8px; align-items: center; }
        input, select { background: #333; color: white; border: 1px solid #444; padding: 10px; border-radius: 4px; }
        .search-input { flex-grow: 2; }

        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 8px; overflow: hidden; }
        th { background: #2a2a2a; text-align: left; padding: 12px; border-bottom: 2px solid var(--accent); font-size: 0.75rem; color: var(--grey); text-transform: uppercase; letter-spacing: 1px; }
        td { padding: 8px 12px; border-bottom: 1px solid #333; vertical-align: middle; }
        
        tr:hover { background: #252525; }
        .cat-badge { font-size: 0.65rem; font-weight: bold; padding: 2px 5px; border-radius: 4px; background: var(--accent); color: white; text-transform: uppercase; }
        .rarity-text { font-size: 0.85rem; font-style: italic; color: #bbb; }
        .cost-text { color: var(--gold); font-family: monospace; font-weight: bold; font-size: 0.9rem; }
        .source-text { font-size: 0.8rem; color: var(--grey); white-space: nowrap; }
        .desc-text { font-size: 0.9rem; }
    </style>
</head>
<body>

<div id="app" class="container">
    <header>
        <h1>Shadow of the Weird Wizard <small style="color:var(--grey); font-weight:normal;">| Item Catalogue</small></h1>
        <a href="WWindex.html" style="color: #888; text-decoration: none;">← Back to Main Menu</a>
    </header>

    <div class="controls">
        <input type="text" v-model="search" placeholder="Search name, description, or rarity..." class="search-input">
        
        <select v-model="filterCat">
            <option value="All">All Categories</option>
            <option v-for="c in categories" :value="c">{{c}}</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 100px;">Category</th>
                <th style="width: 100px;">Rarity</th>
                <th style="width: 180px;">Name</th>
                <th>Description</th>
                <th style="width: 90px;">Cost</th>
                <th style="width: 120px;">Source</th>
            </tr>
        </thead>
        <tbody>
           <tr v-for="item in filtered" :key="item.name + '-' + item.cat + '-' + item.src">
                <td><span class="cat-badge">{{item.cat}}</span></td>
                <td class="rarity-text">{{item.rarity}}</td>
                <td><strong>{{item.name}}</strong></td>
                <td class="desc-text">{{item.desc}}</td>
                <td class="cost-text">{{item.cost}}</td>
                <td class="source-text">{{item.src}} <span v-if="item.pg">p.{{item.pg}}</span></td>
            </tr>
        </tbody>
    </table>
</div>

computed: {
        filtered() {
            return this.database.filter(i => {
                const query = this.search.toLowerCase().trim();
                const matchCat = this.filterCat === 'All' || i.cat === this.filterCat;
                
                if (!query) return matchCat;

                // Split search into individual words so multi-word searches work cleanly
                const searchTerms = query.split(/\s+/);

                const name = (i.name || '').toLowerCase();
                const desc = (i.desc || '').toLowerCase();
                const rarity = (i.rarity || '').toLowerCase();
                const cat = (i.cat || '').toLowerCase();
                const src = (i.src || '').toLowerCase();

                // Combine searchable text fields into one target string
                const searchableText = `${name} ${desc} ${rarity} ${cat} ${src}`;

                // Ensure ALL typed search words exist somewhere in the item's text
                const matchesSearch = searchTerms.every(term => searchableText.includes(term));

                return matchCat && matchesSearch;
            }).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
        }
    }
}).mount('#app')
