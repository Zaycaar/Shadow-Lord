<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abaddon: Angel in the Void - Spell Database</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0c0c0e; color: #e0e0e0; margin: 20px; }
        .controls { background: #151518; padding: 20px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; position: sticky; top: 10px; z-index: 100; border: 1px solid #2d2d35; }
        input, select { padding: 10px; border-radius: 4px; border: 1px solid #3d3d45; background: #222227; color: white; min-width: 150px; }
        
        .spell-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .spell-card { background: #151518; border-radius: 6px; padding: 18px; border-top: 4px solid #555; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        
        /* Specific coloring for Abaddon types */
        .card-magic { border-top-color: #00ffff; } /* Purple/Violet for Magic */
        .card-psychic { border-top-color: #8a2be2; } /* Cyan/Electric for Psychic */
        
        .spell-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .spell-name { font-size: 1.25em; font-weight: bold; color: #fff; }
        
        /* Tag styling */
        .type-tag { font-size: 0.75em; padding: 3px 10px; border-radius: 10px; text-transform: uppercase; background: #222227; font-weight: bold; border: 1px solid #3d3d45; }
        .tag-magic { color: #03dac6; }
        .tag-psychic { color: #bb86fc; }
        
        .spell-desc { font-size: 0.95em; line-height: 1.5; color: #cccccc; }
        .spell-desc b { color: #ffffff; }
    </style>
</head>
<body>

    <h1 style="color: #8F8725; margin-bottom: 5px;">Abaddon: Angel in the Void</h1>
    <p style="color: #888; margin-top: 0; margin-bottom: 20px;">Spell & Ability Database</p>
    <a href="ABindex.html" style="color: #888; text-decoration: none;">← Back to Main Menu</a>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search names..." onkeyup="filterSpells()">
        
        <select id="typeFilter" onchange="filterSpells()">
            <option value="All">All Types</option>
            <option value="Magic">Magic</option>
            <option value="Psychic">Psychic</option>
        </select>
    </div>

    <div class="spell-grid" id="spellGrid"></div>

    <script>
        // DATA ENTRIES
        // Populate this array with your custom Abaddon entries. 
        // Example placeholders provided below.
        const spells = [
            {
                name: "Void Fracture",
                type: "Magic",
                desc: "Rend the fabric of reality. Deals damage over time to all targets within the chosen area and inflicts a phasing penalty."
            },
            {
name: "Adaptive learning",
type: "Psychic",
desc: "When you make an action roll, use a free action to roll with 1 boon. If the action roll results in a failure, you become Enhanced in the attribute you used for 1 minute."
},
{
name: "Banishment",
type: "Psychic",
desc: "Target one creature you can see within 20 yards. Make a Will roll against the target’s Will. <br>~On a success, the target teleports to an empty space of its Size within 40 yards of you. <br>~On a critical success, the target instead becomes Removed (luck ends); targets who fail three luck rolls to end the affliction disappear into the Void. <br>~On a critical failure, you become Removed (luck ends); should you fail three luck rolls to end the affliction, you become lost to the Void—make a new character. "
},
{
name: "Block Perception",
type: "Psychic",
desc: "Target one creature within 10 yards. Make an Intellect roll against the target’s Perception. On a success, you become Invisible to that target for 1 hour. The fortune ends early if you harm a target affected by this power. <br><b>Augmentation:</b> Each token expended beyond the first enables you to target another creature within range."
},
{
name: "Brain Fog",
type: "Psychic",
desc: "Send confounding thought waves out from your mind throughout a Size 5 space centered on you. The waves move with you. The effect lasts 1 minute. When an enemy starts their turn in the space, they make a Will roll. On a success, the enemy becomes immune to this effect for 1 minute. On a failure, they become Confused and Vulnerable (luck ends both). If the enemy has either or both afflictions already, they gain 1 horror instead.<br><b>Augmentation:</b> Expend an additional token to gain the Slippery trait untilthis effect ends."
},
{
name: "Mind over Matter",
type: "Psychic",
desc: "Target one creature or unsecured object of up to Size 1 within 10 yards. Make a Will roll against a target creature’s Strength. On a success, or if you target an object, the target ascends 2 yards into the air and remains there for 1 minute. An affected target creature becomes Strength Impaired, Agility Impaired, and Vulnerable until the effect ends. A target creature can overcome this effect with a successful Strength roll. <br>An affected target can crawl across a vertical surface it can reach or fly if it has the appropriate trait; otherwise, expending Speed to move has no effect for the target.<br>Until the effect ends, you have access to the following talents:<br>~<b>Raise and Lower:</b> Use an action to target one creature or object affected by this power. The target ascends or descends 2 yards and stays there.<br>~<b>Hurl Matter:</b> Use an action and expend 1 token to throw an affected target to a space within 10 yards of it. The target moves toward that space until it reaches it or encounters an obstacle. Should the target encounter an obstacle, it and the obstacle each take 2d6 damage, and the power’s entire effect ends.<br><b>Augmentation:</b> Each additional token you expend enables you to target another creature or object in range. You also increase the maximum Size of a legitimate target by 1 for each token expended in this way. If you use Hurl Matter on a target larger than Size 1, it and the obstacle take 1d6 extra damage for every point of the target’s Size above 1."
},
{
name: "Ectoplasmic Exhalation",
type: "Psychic",
desc: "Target one Size 5 space adjacent to you. You exhale a cloud of ectoplasm—a physical manifestation of psychic energy—that fills the space with heavy obscurement for 1 minute. The cloud extinguishes all ordinary flames in the space and coats everything in it with slippery slime. The ground in the space becomes difficult terrain, and any creature that starts its turn there becomes Will Impaired until the start of its next turn.<br><b>Augmentation:</b> Each additional token expended increases the Size of the space by 1. In addition, if you expend 2 additional tokens, each creature in the space when the cloud appears makes a Will roll; on a failure, the creature becomes Frightened of you (luck ends)."
},
{
name: "Ectoplasmic Weapon",
type: "Psychic",
desc: "Blow slimy ectoplasm from your mouth and shape it into a melee weapon that becomes hard as steel. (Select from the weapon options on page 35.) The weapon remains for as long as you hold onto it; it dissipates into a pool of slime if it leaves your hand.<br><b>Augmentation:</b> Expend an additional token to roll to attack with 1 boon when using the weapon. When you attack with the weapon and get a success on the roll, you can expend tokens; for every token expended in this way, the attack deals an extra 2d6 damage."
},
{
name: "Fetch Object",
type: "Psychic",
desc: "Target one Size 1/2 or smaller object you can see within 10 yards. The target teleports to any empty space of its Size within 10 yards. If a creature is wearing or carrying the target, that creature first makes a luck roll. On a success, nothing happens; on a failure, the target object teleports as described above."
},
{
name: "Fold Dimension",
type: "Psychic",
desc: "Target one space of your Size that you can see within 20 yards. You teleport to that space. If a creature or object occupies that space, make a luck roll. On a success, you push the creature or unsecured object to the nearest empty space. On a failure—or if you target a space occupied by a secured object—you become horribly fused with the creature or object. You and the creature or object lose 10d6 Health, and anyone who can see this makes a Will roll; on a failure, they gain 1d6 horror. Fused creatures or objects cease to function but remain a hideous monument to your folly.<br><b>Augmentation:</b> Expend an additional token to choose any space within 100 yards. Expend 2 additional tokens to choose any space within 1,000 yards. Expend 3 or more additional tokens to target a space within 1 mile + 1 mile for each token beyond 3. You need not have line of sight to the target space."
},
{
name: "Kinetic Outburst",
type: "Psychic",
desc: "Release a burst of telekinetic energy into an adjacent Size 5 space. You move 5 yards in a direct line away from that space in a direction you choose. Each object in the space takes 2d6 damage. Each creature in the space takes 1d6 damage and makes a Strength roll. On a failure, the creature takes an extra 1d6 damage and gets pushed 5 yards away from the space you left; on a critical failure, the creature also falls Prone. <br><b>Augmentation:</b> Eachadditional token you expend causes creatures and objects to take an extra 1d6 damage. If creatures or objects take 5d6 damage or more, the effect also rips up the ground, turning it into difficult terrain that remains until cleared away."
},
{
name: "Mental manipulation",
type: "Psychic",
desc: "Target one creature within 10 yards. Make an Intellect roll against the target’s Will. On a success, the target gains one of the following afflictions (luck ends): Charmed, Confused, Enraged, or Frightened of you. On a critical success, the target also becomes Intellect or Will Impaired until the affliction ends.<br><b>Augmentation:</b> When you expend an additional token and get a success on the roll, you erase the last 5 minutes of the target’s memory so it cannot recall what happened during that time."
},
{
name: "Mind over Body",
type: "Psychic",
desc: "Produce one of the following effects:<br>~Heal 2d6 damage.<br>~Regain 1d6 Health.<br>~End one infection affecting you. For 1 hour afterward, you remain immune to infection.<br>~Become immune to the harmful effects of exposure for 8 hours.<br>~End the Poisoned affliction if you have it. For 1 hour afterward, you remain immune to the Poisoned affliction. "
},
{
name: "One Thousand Faces",
type: "Psychic",
desc: "Change your appearance. The change lasts until you use this power again. You determine your appearance: skin color, eye color, gender, height and weight (you can become up to 30 percent taller, shorter, heavier, or lighter), and so on. You also can increase your Strength by 1 by reducing your Agility by 1, and vice versa.<br><b>Augmentation:</b> Each additional token you expend enables you to target one creature that can see you. The target makes a Will roll; on a failure, it becomes Frightened of you (luck ends)."
},
{
name: "Psychometry",
type: "Psychic",
desc: "Concentrate on one object you touch. You learn all the target’s traits and how to make use of them.<br>~You automatically learn the item’s function.<br>~If the target is a weapon, you roll to attack with it with 1 boon until after you rest. <br>In addition, you can make an Intellect roll. On a success, you learn the identity of the last person to handle the target for 1 minute or longer, the amount of time since anyone has handled it, and one or more hints about its origin."
},
{
name: "Pyrokinesis",
type: "Psychic",
desc: "You become immune to damage from fire for 1 hour. Until this effect ends, you can use the following talents:<br>~<b>Fire Burst:</b> Use an action to target one Size 5 space within 20 yards. You cause fire to fill the space, then dissipate. Each object in the space takes 2d6 damage, and flammable objects take 1d6 Ongoing Damage until extinguished. Each creature in the space makes a luck roll. On a failure, the creature takes 2d6 damage; on a critical failure, it also takes 1d6 Ongoing Damage (luck ends). When a creature fails a luck roll, you can expend psychic tokens; for each one expended, that creature takes an extra 1d6 damage.<br>~<b>Flame Whip:</b> Use an action to identify one flame within 10 yards and target one creature or object within 10 yards of the flame. You cause a tendril of the flame to lash the target. Make a Will roll against the target’s Defense. On a success, the target takes 2d6 damage; on a critical success, it also takes 1d6 Ongoing Damage (luck ends). If you get a success, you can expend psychic tokens; for each one expended, the target takes an extra 1d6 damage.<br>~<b>Ignite:</b> Use an action to target one flammable object you can see within 10 yards. The target takes 1d6 Ongoing Damage until extinguished. If a creature wears or carries the object, the creature makes a luck roll; on a success, the target smolders and goes out. For each token you expend, you can target another flammable object within range.<br>~<b>Wall of Flame:</b> Use an action to create a fiery wall along one side of a Size 10 space within 20 yards. The fire burns for 1 minute or until extinguished. Any creature or object passing through the wall takes 2d6 damage and makes a luck roll; on a failure, the creature or object takes 1d6 Ongoing Damage (luck ends or until extinguished). A creature or object can take this damage from a particular wall just once per round, regardless of how many times it passes through it.<br><b>Augmentation:</b> Each token expended beyond the first extends the duration by 2 hours."
},
{
name: "Remote View",
type: "Psychic",
desc: "Target a Size 1 space within 100 yards that you have seen at least once before. Your mind travels to that place and remains there for 1 hour. (The effect ends early if you become Unconscious.) You see and hear from the target space as if you were there—you can look around in any direction; the quality of your senses dictates how much you pick up. However, you are considered Perception Impaired in the space your body occupies. <br><b>Augmentation:</b> Expend an additional token to extend the power’s range to 1 mile or its duration to 4 hours."
},
{
name: "Telekinesis",
type: "Psychic",
desc: "Use your mind as an extra limb. The effect lasts 1 hour, ending early if you become Confused, Controlled, Stunned, or Unconscious. Your telekinetic limb has a range of 5 yards and enables you to pick up, move, open, close, or carry things—to do what one can do normally with one or two hands. You can even wield weapons and perform unarmed attacks. However, when making an attribute roll as a result of employing this extra limb, use Will in place of the attribute you normally would use.<br><b>Augmentation:</b> When you make a Will roll as result of using this power, you can expend 1 token to make the roll with 2 boons."
},
{
name: "Telepathy",
type: "Psychic",
desc: "You become Intellect and Will Impaired for 1 hour. While you have these afflictions, you can communicate with any creature within 100 yards without having to speak. You make your intentions clear even if you have no common language. If the creature knows at least one language, it can communicate with you in the same manner. <br>When you attempt to communicate in this way, the creature can use a reaction to make a Will roll. On a success, it becomes immune to this power for 1 hour. On a critical success, you gain 1 horror; on a critical failure, the creature gains 1 horror.<br>In addition, until this effect ends, you can use the following talent:<br>~<b>Hostile Thought:</b> Use an action and expend 1 psychic token to target one creature within range of this power. Make an Intellect roll against the target’s Will. On a success, the target takes 2d6 damage; on a critical success, it also takes 1 horror. <br><b>Augmentation:</b> Expend an additional token to increase the duration to 12 hours. When you get a success on the Hostile Thought roll, you can expend 1 token to deal an extra 2d6 damage. "
},
{
name: "Thought Bind",
type: "Psychic",
desc: "Target one creature within 10 yards. Make a Will roll against the target’s Strength. On a success, the target becomes Held (luck ends)—it can overcome this effect with a successful Strength roll. On a failure, you become Accelerated until the end of your turn. <br>While you have a target Held in this way, you can use the following talent:<br>~<b>Tightening Grip:</b> Expend 1 token and use an action to target any number of creatures Held by your use of this power. The targets each take 2d6 damage.<br><b>Augmentation:</b> When you use this power, for each token you expend beyond the first, you may target one additional creature. "
},
{
name: "Thought Crystal",
type: "Psychic",
desc: "Release a cloud of ectoplasm from your mouth that immediately solidifies into a crystal shard that floats in the air near your head. The crystal remains until destroyed (Health 5) or you use Crystal Shard Strike.<br>~<b>Crystal Shard Strike:</b> Use a free action to expend any number of your crystal shards. For each shard, choose a creature within 10 yards and make a Will roll against the target’s Intellect. On a success, the shard hits its target and deals 1d6 damage; on a critical success, the target takes an extra 1d6 damage and becomes Intellect Impaired (luck ends). <br><b>Augmentation:</b> Each additional token you expend forms another crystal shard."
},
{
name: "Physical Adaptation",
type: "Psychic",
desc: "Gain one of the following traits: Climber, Dark Vision, Silent, Slippery, Strider, or Swimmer. If you choose Swimmer, you also become Amphibious. The effect lasts 1 hour but ends early if you become incapacitated.<br><b>Augmentation:</b> Expend 1 extra token to choose Malleable. Expend 2 extra tokens to choose Burrower. Expend 3 extra tokens to choose Flier. Expend 5 extra tokens to choose Unfettered or True Vision."
},
{
name: "Psychic Awareness",
type: "Psychic",
desc: "You perceive the smallest detail. For 1 hour, you have the Awareness 10 trait and become Perception Enhanced and Blessed. Until this effect ends, you also can use the following talent:<br>~<b>Avoid Peril:</b> Use a reaction and expend 1 token when a creature makes a roll against you or you roll to mitigate or avoid harm. You impose 2 banes on the creature’s roll, or you make the roll with 2 boons."
},
{
name: "Weapon of Flesh",
type: "Psychic",
desc: "Increase your Health by 10 and transform one of your arms into a blade or bludgeon. The effect lasts 1 hour. You treat the weaponized limb as a natural weapon that deals 2d6 damage. When you attack with it, you roll with 1 boon. If you choose a blade, it gains the Slashing trait. If you choose a bludgeon, it gains the Bludgeoning trait."
},
{
name: "Unstable Portals",
type: "Psychic",
desc: "Target two empty Size 1 spaces within 20 yards of you and within 20 yards of each other. A wavering portal appears in each space and remains for 1 minute. Whenever a creature or object moves into the space containing a portal, roll a d6 to determine what happens: <br>1: Subject is Removed until the end of the round.<br>2-3: Nothing happens. <br>4-5: Subject disappears, reappearing in an open space adjacent to the other portal. 6: Subject disappears, reappearing in an open space adjacent to the other portal; a subject creature becomes Hastened until the end of its next turn. <br><b>Augmentation:</b> Expend an additional token to make the portals stable; a creature or object entering one exits from the other immediately. <br>Expend 3 additional tokens to target occupied spaces in range. Objects in those spaces lose all their Health and crumble to rubble or the equivalent. Creatures in those spaces make luck rolls; a Held creature gets an automatic failure. On a success, the creature moves 1 yard to an empty space. On a failure, it moves 1 yard to an empty space, takes 5d6 damage, and falls Prone."
},
        ];

        function displaySpells(spellsToShow) {
            const grid = document.getElementById('spellGrid');
            grid.innerHTML = '';
            
            if(spellsToShow.length === 0) {
                grid.innerHTML = '<p style="color: #888; font-style: italic;">No spells found matching the criteria.</p>';
                return;
            }

            spellsToShow.forEach(spell => {
                const card = document.createElement('div');
                card.className = `spell-card card-${spell.type.toLowerCase()}`;
                
                card.innerHTML = `
                    <div class="spell-header">
                        <div class="spell-name">${spell.name}</div>
                        <span class="type-tag tag-${spell.type.toLowerCase()}">${spell.type}</span>
                    </div>
                    <div class="spell-desc">${spell.desc}</div>
                `;
                grid.appendChild(card);
            });
        }

        function filterSpells() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const typeVal = document.getElementById('typeFilter').value;

            const filtered = spells.filter(spell => {
                const matchesSearch = spell.name.toLowerCase().includes(searchVal);
                const matchesType = (typeVal === 'All' || spell.type === typeVal);
                
                return matchesSearch && matchesType;
            });

            displaySpells(filtered);
        }

        // Initial paint
        displaySpells(spells);
    </script>
</body>
</html>
